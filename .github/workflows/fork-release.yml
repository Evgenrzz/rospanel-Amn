name: fork-release

# Fork release pipeline. release-please cannot track versions on a fork (the
# fork copies tags but not the upstream Release objects, so it mis-detects the
# last release and rolls the version back). This repo instead releases by tag:
# bump internal/version/version.go, commit, then push a vX.Y.Z tag — this
# workflow builds the binaries with the exact flags upstream's release job uses
# (web/dist embedded, stripped, static), writes SHA256SUMS, and publishes the
# GitHub Release the panel's self-updater downloads from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Go binary embeds web/dist (embed.FS), so the frontend builds first.
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "rospanel-linux-$arch" ./cmd/rospanel/
          done

      # The self-updater verifies the download against this file before running
      # or swapping it in, so it ships with every release.
      - name: Generate checksums
        run: sha256sum rospanel-linux-amd64 rospanel-linux-arm64 > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rospanel-linux-amd64 rospanel-linux-arm64 SHA256SUMS --clobber
          else
            gh release create "$TAG" rospanel-linux-amd64 rospanel-linux-arm64 SHA256SUMS \
              --title "$TAG" --generate-notes
          fi
