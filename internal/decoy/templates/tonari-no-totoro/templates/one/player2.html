<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Видеоплеер 2 — Мой сосед Тоторо (1988)</title>
<style>
html,body{height:100%;margin:0;background:#101418;color:#d5dbe6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.inner{position:relative;z-index:2;text-align:center;padding:0 16px}
.play{width:64px;height:64px;border-radius:50%;border:3px solid #4ea1ff;display:inline-block;position:relative;cursor:default}
.play::after{content:"";position:absolute;left:24px;top:18px;border-left:20px solid #4ea1ff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.caption{margin-top:14px;font-size:14px}
.hint{margin-top:6px;font-size:12px;color:#79839a}
</style>
</head>
<body>
<div class="stage">
<img class="poster" src="/templates/one/img/poster.jpg" alt="Постер фильма">
<div class="inner">
<span class="play"></span>
<div class="caption">Плеер №2. Сервер загружен, очередь на воспроизведение…</div>
<div class="hint">Если видео не начинается в течение минуты, переключитесь на основной плеер.</div>
</div>
</div>
</body>
</html>
